<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看板娘设置中心</title>
    <script src="assets/jquery.min.js?v=3.3.1"></script>
    <script src="assets/waifu-config.js"></script>
    <link rel="stylesheet" type="text/css" href="assets/settings-center.css?v=1.0.2">
</head>
<body>
    <div class="settings-app">
        <header class="settings-app-header">
            <h1>看板娘设置中心</h1>
            <div class="settings-app-actions">
                <span class="settings-sync-pill" id="settings-sync-indicator">
                    <span class="settings-sync-dot"></span>
                    <span class="settings-sync-text">等待载入</span>
                </span>
                <a class="settings-app-link" href="live2d.html" target="_blank" rel="noopener noreferrer">打开桌宠页</a>
            </div>
        </header>

        <main class="settings-shell">
            <div id="settings-inject-container" class="settings-inject-container">
                <div class="settings-loading">
                    <div class="settings-loading-dot"></div>
                    <p>正在载入设置中心...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        $(document).ready(function() {
            $("#settings-inject-container").load("settings-content.html", function(response, status, xhr) {
                if (status === "error") {
                    $("#settings-inject-container").html(
                        '<div class="settings-error">' +
                        '<h2>设置面板载入失败</h2>' +
                        '<p>' + xhr.status + ' ' + xhr.statusText + '</p>' +
                        '</div>'
                    );
                    return;
                }

                initSettingsCenter();
            });
        });

        function initSettingsCenter() {
            var defaultSettings = JSON.parse(JSON.stringify(window.WAIFU_GLOBAL_DEFAULTS));
            var $container = $("#settings-inject-container");
            var $syncIndicator = $("#settings-sync-indicator .settings-sync-text");
            var $syncPill = $("#settings-sync-indicator");

            function setSyncStatus(text) {
                if (!$syncIndicator.length) return;
                $syncIndicator.text(text);
                $syncPill.removeClass('is-ready is-error');
                if (text.indexOf('失败') !== -1) {
                    $syncPill.addClass('is-error');
                } else {
                    $syncPill.addClass('is-ready');
                }
            }

            function readStoredConfig() {
                var saved = localStorage.getItem('waifu_global_settings');
                var savedObject = saved ? JSON.parse(saved) : {};
                return $.extend({}, defaultSettings, savedObject);
            }

            function applyConfigToInputs(config) {
                $container.find('.config-item').each(function() {
                    var $input = $(this);
                    var key = $input.data('key');
                    var value = config[key];
                    if (value === undefined) return;

                    if ((key === 'waifuSize' || key === 'waifuTipsSize') && Array.isArray(value)) {
                        value = value[0] + 'x' + value[1];
                    }

                    if ($input.attr('type') === 'checkbox') {
                        $input.prop('checked', !!value);
                    } else {
                        $input.val(value);
                    }
                });
            }

            function syncConditionalUI() {
                var target = $('#peek-target-type').val();
                var ttsService = $('#tts-service').val();

                if (target === 'window') $('#group-window-select').show();
                else $('#group-window-select').hide();

                if (ttsService === 'gpt_sovits') $('#tts-provider-gpt-sovits').show();
                else $('#tts-provider-gpt-sovits').hide();
            }

            function syncLiveSettingsFromStorage() {
                try {
                    $.extend(window.live2d_settings, readStoredConfig());
                    applyConfigToInputs(window.live2d_settings);
                    syncConditionalUI();
                    setSyncStatus('已同步最新设置');
                } catch (error) {
                    console.error('[SettingsCenter] 同步失败:', error);
                    setSyncStatus('同步失败');
                }
            }

            function getInputValue($input) {
                if ($input.attr('type') === 'checkbox') return $input.is(':checked');
                return $input.val();
            }

            function activateTab(tabName) {
                var $target = $('.settings-tab-item[data-tab="' + tabName + '"]');
                if ($target.length) {
                    $target.trigger('click');
                }
            }

            function handleDeepLink() {
                var params = new URLSearchParams(window.location.search);
                var targetTab = params.get('tab') || 'general';
                var action = params.get('action') || '';
                var reportCategory = params.get('reportCategory') || '';

                activateTab(targetTab);

                if (targetTab === 'report' && reportCategory && $('#report-category').length) {
                    $('#report-category').val(reportCategory).trigger('change');
                }

                if (targetTab === 'report' && action === 'generate') {
                    window.setTimeout(function() {
                        $('#btn-gen-report').trigger('click');
                    }, 180);
                }
            }

            async function bootstrapAsyncData() {
                if (!$('input[data-key="pythonServerUrl"]').val()) {
                    return;
                }

                var tasks = [];
                if (window.WaifuShared && typeof window.WaifuShared.fetchModelList === 'function') {
                    tasks.push(Promise.resolve(window.WaifuShared.fetchModelList($('.btn-refresh-models').first())));
                }
                if (window.WaifuShared && typeof window.WaifuShared.refreshWindowList === 'function') {
                    tasks.push(Promise.resolve(window.WaifuShared.refreshWindowList($('#btn-refresh-windows'))));
                }
                if (tasks.length) {
                    await Promise.allSettled(tasks);
                }
            }

            syncLiveSettingsFromStorage();
            setSyncStatus('已载入配置');

            $container.on('change', '.config-item', function() {
                var $input = $(this);
                var key = $input.data('key');
                if (!key) {
                    syncConditionalUI();
                    return;
                }

                window.live2d_settings[key] = getInputValue($input);
                saveGlobalSettings();
                syncConditionalUI();
                setSyncStatus('已保存并同步');
            });

            $container.on('click', '.settings-tab-item', function() {
                var tab = $(this).data('tab');
                if (!tab) return;
                var params = new URLSearchParams(window.location.search);
                params.set('tab', tab);
                params.delete('action');
                history.replaceState({}, '', 'settings.html?' + params.toString());
            });

            window.addEventListener('storage', function(event) {
                if (event.key !== 'waifu_global_settings') return;
                syncLiveSettingsFromStorage();
            });

            bootstrapAsyncData().finally(function() {
                handleDeepLink();
            });
        }
    </script>
</body>
</html>
